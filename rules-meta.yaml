# 规则元数据：每条规则 = ID / 严重级 / 法规与平台依据 / 修复建议
# 结构借鉴 checkov 的检查项（CKV_* ID + 严重级 + 修复指引）与 conftest 的失败消息设计。
# 严重级：blocker=不建议提审（大概率拒审/下架） / warning=应修复但不阻塞提审
rules:
  - id: AIG01
    name: AI 生成内容显式标识（交互界面）
    severity: blocker
    basis: 《人工智能生成合成内容标识办法》第四条第一款——交互场景界面添加显著提示
    fix: AI 对话/推荐结果界面固定挂「内容由 AI 生成，仅供参考」显著提示（wxml 模板）
  - id: AIG02
    name: 复制/导出路径追加生成标识
    severity: blocker
    basis: 《办法》第四条/第五条——提供复制/下载/导出时保留标识
    fix: wx.setClipboardData 的 data 末尾自动追加标识文案；导出文件元数据写入隐式标识
  - id: NET01
    name: 网络请求合法域名（HTTPS + 无明文回落）
    severity: blocker
    basis: 微信平台规则——request 合法域名必须 HTTPS 且已备案
    fix: 全部 API 走 https:// 已备案域名；删除 http:// 明文调用与本地 IP 直连
  - id: REG01
    name: 深度合成类目提审材料齐备
    severity: blocker
    basis: 微信平台深度合成类目要求（仅非个人主体）+ 模型技术方算法备案材料
    fix: compliance/checklist.yaml 中全部 required 材料就绪（status=ready 及 checked/completed/已就绪 等同义词；营业执照、技术方备案文件、标识样式截图、协议文本）
  - id: BASE01
    name: 基础库版本门槛（云开发 AI ≥ 3.15.1）
    severity: warning
    basis: 微信开放文档 wx.cloud.extend.AI 基础库门槛；低版本需降级兜底
    fix: project.config.json libVersion ≥ 3.15.1，或代码内提供低版本降级文案
